name: Daily swole sync

on:
  schedule:
    # Four runs a day (UTC): ~7am, noon, 5pm and 9pm Eastern, so today's food and workouts show up.
    # The 7am run carries last night's sleep and this morning's readiness.
    - cron: "17 11,16,21 * * *"
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Only print the field names Garmin returns (no data values, nothing saved)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Two overlapping runs could each rotate a Withings/Strava refresh token and one would be lost.
  group: swole-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Probe Garmin response shapes
        if: inputs.probe
        env:
          SWOLE_PASSPHRASE: ${{ secrets.SWOLE_PASSPHRASE }}
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
        run: python -m swole.run --probe

      - name: Pull data and recompute
        id: run
        if: ${{ !inputs.probe }}
        env:
          SWOLE_PASSPHRASE: ${{ secrets.SWOLE_PASSPHRASE }}
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
        run: python -m swole.run
        continue-on-error: true

      - name: Commit encrypted data and rotated tokens
        if: ${{ always() && !inputs.probe }}
        run: |
          git config user.name "swole-sync"
          git config user.email "swole-sync@users.noreply.github.com"
          git add -A state site
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Sync $(date -u +%Y-%m-%dT%H:%MZ)"
            # A food-log import may have been pushed meanwhile; replay this commit on top.
            git pull --rebase -q origin main
            git push
          fi

      - name: Fail the run if a source failed (GitHub emails you)
        if: steps.run.outcome == 'failure'
        run: |
          echo "One or more sources failed. See the 'Pull data and recompute' step."
          exit 1
