name: Daily swole sync

on:
  schedule:
    # 11:17 UTC = 7:17 EDT / 6:17 EST, after the watch has synced last night. Adjust to taste.
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Two overlapping runs could each rotate a refresh token and one would be lost.
  group: swole-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull data and recompute
        id: run
        env:
          SWOLE_PASSPHRASE: ${{ secrets.SWOLE_PASSPHRASE }}
        run: python -m swole.run
        continue-on-error: true

      - name: Commit encrypted data and rotated tokens
        if: always()
        run: |
          git config user.name "swole-sync"
          git config user.email "swole-sync@users.noreply.github.com"
          git add -A state site
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily sync $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Fail the run if a source failed (GitHub emails you)
        if: steps.run.outcome == 'failure'
        run: |
          echo "One or more sources failed. See the 'Pull data and recompute' step."
          exit 1
